odam:
  enabled: true

  # Start conservatively. Calibrate this against the detection-loss gradient
  # norm before running a long experiment.
  lambda_odam: 0.5
  start_epoch: 0
  warmup_epochs: 3
  every_n_batches: 1

  max_samples_per_image: 16
  max_samples_per_object: 4
  min_assignment_iou: 0.0

  map_height: 40
  map_width: 40
  # Paper ODAM applies a local smoothing Phi to the gradient map before
  # feature-gradient multiplication. 3 is conservative for YOLO P-level maps.
  smoothing_kernel: 3
  # Paper describes predicted confidence scores as ODAM targets. YOLOv8 has no
  # separate objectness branch, so sigmoid(class_logit) is the closest default.
  # raw_logit remains available for exact old behavior.
  target_activation: sigmoid
  negative_overlap_iou: 0.0
  include_self_positive: false
  eps: 1.0e-6

  # false = first-order, gradient detached, matching released ODAM-Train code.
  # true = experimental second-order variant; substantially more VRAM/time.
  second_order: false

  strict_p2: true
  expected_num_levels: 4
  expected_strides: [4, 8, 16, 32]
